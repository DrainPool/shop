<!--
  Taggat — flikikonen. Tadgmärket: hängande tagg med stansat hål och ett
  graverat T i negativ yta (koncept 2, okt 2026 — ersätter "Puns"-ringen).

  Ingen currentColor: i en fristående SVG som laddas via <img> löser
  currentColor till SVART. Explicit fyllning i stället, med en
  prefers-color-scheme-variant med palettens egna roller:
    ljust läge  = --primary-deep, oklch(0.47 0.08 78)  ->  #735520
    mörkt läge  = --primary-deep i .dark, oklch(0.78 0.09 82)  ->  #D4B273
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Taggat">
  <style>
    path {
      fill: #735520;
    }
    @media (prefers-color-scheme: dark) {
      path {
        fill: #d4b273;
      }
    }
  </style>
  <path
    fill-rule="evenodd"
    d="M8 16 Q8 8 16 8 L43 8 L56 21 L56 52 Q56 60 48 60 L16 60 Q8 60 8 52 Z
       M34 11 A4.6 4.6 0 1 0 34 20.2 A4.6 4.6 0 1 0 34 11 Z
       M22 27 L42 27 L42 33.5 L35.2 33.5 L35.2 52 L28.8 52 L28.8 33.5 L22 33.5 Z"
  />
</svg>

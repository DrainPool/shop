<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>TaggaDet — rastergenerator för flikikoner</title>
    <!--
      Genererar de kvadratiska PNG-ikonerna genom att skärmdumpas i exakt
      storlek. Repot har ingen bildrasteriserare (inget sharp, resvg eller
      ImageMagick), och inga nya beroenden får läggas till — så webbläsaren får
      göra jobbet. Edge finns redan installerad.

      Så här körs den (från repo-roten):

        EDGE="/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"

        # favicon-32.png — genomskinlig botten, mörk sepia
        "$EDGE" --headless=new --disable-gpu --hide-scrollbars \
          --default-background-color=00000000 \
          --screenshot=public/favicon-32.png --window-size=32,32 \
          "file:///C:/Users/frall/shop/design-system/taggadet/logo/ikon.html?s=32"

        # apple-touch-icon.png — 180 px, OPAGEN botten
        "$EDGE" --headless=new --disable-gpu --hide-scrollbars \
          --screenshot=public/apple-touch-icon.png --window-size=180,180 \
          "file:///C:/Users/frall/shop/design-system/taggadet/logo/ikon.html?s=180&bg=1"

      Parametrar:
        s   = sidans mått i px (måste matcha --window-size)
        bg  = 1 ger opagen pappersbotten

      Varför apple-touch-icon har opagen botten: iOS lägger sin egen mask över
      ikonen och gör genomskinlighet svart. En transparent fil blir alltså en
      svart ruta på hemskärmen.

      Varför mörk sepia (#735520) och inte guld: PNG-filen är reservvägen för
      webbläsare som inte klarar SVG-favicons, och de är i praktiken ljusa
      flikrader. Den som klarar SVG får favicon.svg, som växlar färg själv.

      Färgen är --primary-deep, uppmätt ur oklch(0.47 0.08 78) i src/styles.css.
      Pappret är --background, oklch(0.967 0.008 85) -> #F6F4EE.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* Bredd och höjd sätts av skriptet till exakt målstorleken. Utan det
         stämmer inte centreringen: --window-size styr skärmdumopens mått, men
         layout-viewporten kan vara bredare (uppmätt 492 px när målet var 180).
         Ett centrerat märke hamnade då utanför den klippta ytan och bilden blev
         tom. Med eksplicit storlek på body ligger märket rätt oavsett. */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        overflow: hidden;
      }
      body.opaque {
        background: #f6f4ee;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg id="mark" viewBox="4 4 40 40">
      <path
        fill="#735520"
        fill-rule="evenodd"
        d="M24 7 A17 17 0 1 0 24 41 A17 17 0 1 0 24 7 Z
           M24 12.5 A11.5 11.5 0 1 0 24 35.5 A11.5 11.5 0 1 0 24 12.5 Z
           M18 18.5 L30 18.5 L30 23.5 L26.5 23.5 L26.5 31 L21.5 31 L21.5 23.5 L18 23.5 Z"
      />
    </svg>
    <script>
      var p = new URLSearchParams(location.search);
      var size = parseInt(p.get("s") || "32", 10);
      if (p.get("bg") === "1") document.body.classList.add("opaque");
      document.body.style.width = size + "px";
      document.body.style.height = size + "px";
      // Märket fyller 78 % av rutan. En flikikon som går kant i kant ser större
      // ut än sina grannar; lite luft gör den läsbar utan att krympa.
      var art = Math.round(size * 0.78);
      var mark = document.getElementById("mark");
      mark.setAttribute("width", art);
      mark.setAttribute("height", art);
    </script>
  </body>
</html>

# Lägg in i server { server_name linsochlager.net; ... } FÖRE "location /".
# Prefixet /shop behålls (ingen avslutande / på proxy_pass) – butiken är byggd med VITE_BASE_PATH=/shop.
location = /shop { return 301 /shop/; }
location /shop/ {
    proxy_pass http://taggat-shop:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
